# RELATRUM Alembic configuration.
# The database URL is read from app settings (environment) in migrations/env.py;
# anything set here is overridden there.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s
timezone = UTC
trim_blocks = true
ltrim_blocks = true

[post_write_hooks]

# Logging configuration (consumed by alembic CLI)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

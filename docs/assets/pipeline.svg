<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="RELATRUM pipeline">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" rx="12" fill="url(#p)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#e2e8f0">
    <g transform="translate(30,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">Source</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">ingest + spans</text>
    </g>
    <g transform="translate(190,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">Statements</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">extract + verify</text>
    </g>
    <g transform="translate(350,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">Alignment</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">TF-IDF + temporal</text>
    </g>
    <g transform="translate(510,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">Findings</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">dossiers + polarity</text>
    </g>
    <g transform="translate(670,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">MRE</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">verification tasks</text>
    </g>
    <g transform="translate(830,40)">
      <rect width="130" height="60" rx="8" fill="#1e3a8a"/>
      <text x="65" y="30" text-anchor="middle" font-weight="600">Report</text>
      <text x="65" y="48" text-anchor="middle" font-size="10" fill="#94a3b8">JSON / Markdown</text>
    </g>
  </g>
  <g stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
      </marker>
    </defs>
    <line x1="160" y1="70" x2="190" y2="70"/>
    <line x1="320" y1="70" x2="350" y2="70"/>
    <line x1="480" y1="70" x2="510" y2="70"/>
    <line x1="640" y1="70" x2="670" y2="70"/>
    <line x1="800" y1="70" x2="830" y2="70"/>
  </g>
  <text x="550" y="170" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">RELATRUM evidence pipeline - ingestion to report</text>
  <rect x="40" y="185" width="1020" height="1" fill="#334155"/>
</svg>

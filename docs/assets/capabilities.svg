<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="RELATRUM capabilities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .card { fill: #0f172a; stroke: #1f2937; stroke-width: 1; rx: 10; }
      .title { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .desc { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
      .icon { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .shimmer { animation: sh 4s ease-in-out infinite; }
      @keyframes sh { 0%,100% { stroke-opacity: 0.7; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="360" rx="12" fill="url(#bg)"/>
  <!-- row 1 -->
  <g transform="translate(20,20)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)">
      <path class="icon" d="M8 3 4 7l4 4"/><path class="icon" d="M4 7h16"/><path class="icon" d="M16 21l4-4-4-4"/><path class="icon" d="M20 17H4"/>
    </g>
    <text class="title" x="102" y="80">Bidirectional alignment</text>
    <text class="desc" x="102" y="100">Requirement to observation</text>
    <text class="desc" x="102" y="114">and reverse</text>
  </g>
  <g transform="translate(245,20)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)" style="animation-delay:0.3s">
      <circle class="icon" cx="12" cy="12" r="10"/><polyline class="icon" points="12 6 12 12 16 14"/>
    </g>
    <text class="title" x="102" y="80">Temporal reasoning</text>
    <text class="desc" x="102" y="100">Effective dates, overlap</text>
    <text class="desc" x="102" y="114">supersession</text>
  </g>
  <g transform="translate(470,20)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)" style="animation-delay:0.6s">
      <path class="icon" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line class="icon" x1="12" y1="8" x2="12" y2="12"/><line class="icon" x1="12" y1="16" x2="12.01" y2="16"/>
    </g>
    <text class="title" x="102" y="80">Counter-evidence</text>
    <text class="desc" x="102" y="100">Conflicting evidence</text>
    <text class="desc" x="102" y="114">preserved</text>
  </g>
  <g transform="translate(695,20)">
    <rect class="card" width="185" height="150"/>
    <g class="shimmer" transform="translate(92,38) scale(1.3) translate(-12,-12)" style="animation-delay:0.9s">
      <path class="icon" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline class="icon" points="14 2 14 8 20 8"/><line class="icon" x1="16" y1="13" x2="8" y2="13"/><line class="icon" x1="16" y1="17" x2="8" y2="17"/>
    </g>
    <text class="title" x="92" y="80">Finding dossiers</text>
    <text class="desc" x="92" y="100">Evidence with polarity</text>
    <text class="desc" x="92" y="114">and review history</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(20,190)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)" style="animation-delay:1.2s">
      <circle class="icon" cx="12" cy="12" r="10"/><circle class="icon" cx="12" cy="12" r="6"/><circle class="icon" cx="12" cy="12" r="2"/>
    </g>
    <text class="title" x="102" y="80">MRE</text>
    <text class="desc" x="102" y="100">Verification tasks</text>
    <text class="desc" x="102" y="114">and responses</text>
  </g>
  <g transform="translate(245,190)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)" style="animation-delay:1.5s">
      <path class="icon" d="M3 3v18h18"/><path class="icon" d="M18 17V9"/><path class="icon" d="M13 17V5"/><path class="icon" d="M8 17v-3"/>
    </g>
    <text class="title" x="102" y="80">Reports and graph</text>
    <text class="desc" x="102" y="100">JSON, Markdown</text>
    <text class="desc" x="102" y="114">evidence graph</text>
  </g>
  <g transform="translate(470,190)">
    <rect class="card" width="205" height="150"/>
    <g class="shimmer" transform="translate(102,38) scale(1.3) translate(-12,-12)" style="animation-delay:1.8s">
      <path class="icon" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle class="icon" cx="9" cy="7" r="4"/><path class="icon" d="M22 21v-2a4 4 0 0 0-3-3.87"/><path class="icon" d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </g>
    <text class="title" x="102" y="80">Multi-tenant RBAC</text>
    <text class="desc" x="102" y="100">Workspaces, roles</text>
    <text class="desc" x="102" y="114">isolation</text>
  </g>
  <g transform="translate(695,190)">
    <rect class="card" width="185" height="150"/>
    <g class="shimmer" transform="translate(92,38) scale(1.3) translate(-12,-12)" style="animation-delay:2.1s">
      <line class="icon" x1="1" y1="1" x2="23" y2="23"/><path class="icon" d="M16.72 11.06A10.94 10.94 0 0 1 19 12.58"/><path class="icon" d="M5 12.58a10.94 10.94 0 0 1 5.17-2.39"/><path class="icon" d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path class="icon" d="M1.42 9a16 16 0 0 1 4.7-2.88"/><path class="icon" d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line class="icon" x1="12" y1="20" x2="12.01" y2="20"/>
    </g>
    <text class="title" x="92" y="80">Offline mock</text>
    <text class="desc" x="92" y="100">No API key</text>
    <text class="desc" x="92" y="114">deterministic</text>
  </g>
</svg>

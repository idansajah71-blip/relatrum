<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="RELATRUM banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .grid { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
      .title { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 62px; font-weight: 700; fill: #f8fafc; }
      .tag { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 18px; fill: #cbd5e1; }
      .shine { animation: shine 4s linear infinite; }
      .particle { animation: float 6s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-400px); } 100% { transform: translateX(1600px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .shine, .particle { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <g class="grid">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="220"/><line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/><line x1="560" y1="0" x2="560" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/><line x1="880" y1="0" x2="880" y2="220"/>
    <line x1="1040" y1="0" x2="1040" y2="220"/>
  </g>
  <circle class="particle" cx="980" cy="50" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle class="particle" cx="1080" cy="120" r="2" fill="#818cf8" opacity="0.6" style="animation-delay:1s"/>
  <circle class="particle" cx="900" cy="180" r="4" fill="#34d399" opacity="0.5" style="animation-delay:2s"/>
  <rect class="shine" x="0" y="0" width="400" height="220" fill="url(#shine)" opacity="0.4"/>
  <rect x="60" y="95" width="6" height="70" fill="#38bdf8" rx="3"/>
  <text class="title" x="84" y="145">RELATRUM</text>
  <text class="tag" x="86" y="178">Where expectations meet evidence.</text>
  <text x="86" y="205" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#64748b">Evidence Intelligence Platform</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="RELATRUM temporal concept">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .axis { stroke: #334155; stroke-width: 2; }
      .req { fill: #1e3a8a; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .obs { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 6; }
      .txt { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
      .sub { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
      .pulse { animation: p 2s ease-in-out infinite; }
      @keyframes p { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="12" fill="url(#c)"/>
  <line class="axis" x1="60" y1="130" x2="840" y2="130"/>
  <text x="60" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b">Jan</text>
  <text x="220" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b">Mar</text>
  <text x="380" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b">Jun</text>
  <text x="540" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b">Sep</text>
  <text x="700" y="120" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#64748b">Dec</text>
  <g transform="translate(80,50)">
    <rect class="req pulse" width="180" height="40"/>
    <text class="txt" x="90" y="20">Requirement v1</text>
    <text class="sub" x="90" y="34">valid 2024-01-01 .. 2024-06-30</text>
  </g>
  <g transform="translate(300,50)">
    <rect class="req pulse" width="200" height="40" style="animation-delay:0.5s"/>
    <text class="txt" x="100" y="20">Requirement v2</text>
    <text class="sub" x="100" y="34">valid 2024-07-01 .. 2024-12-31</text>
  </g>
  <g transform="translate(160,160)">
    <rect class="obs pulse" width="120" height="40" style="animation-delay:1s"/>
    <text class="txt" x="60" y="20">Observation A</text>
    <text class="sub" x="60" y="34">observed 2024-02-15</text>
  </g>
  <g transform="translate(420,160)">
    <rect class="obs pulse" width="120" height="40" style="animation-delay:1.5s"/>
    <text class="txt" x="60" y="20">Observation B</text>
    <text class="sub" x="60" y="34">observed 2024-08-10</text>
  </g>
  <g transform="translate(700,160)">
    <rect class="obs pulse" width="120" height="40" style="animation-delay:2s"/>
    <text class="txt" x="60" y="20">Observation C</text>
    <text class="sub" x="60" y="34">observed 2024-11-05</text>
  </g>
  <text x="450" y="245" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Temporal reasoning - requirement versions vs observations</text>
</svg>

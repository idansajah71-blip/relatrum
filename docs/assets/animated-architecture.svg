<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="RELATRUM animated architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <style>
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 8; }
      .txt { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 13px; fill: #e2e8f0; text-anchor: middle; }
      .sub { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.5s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -12; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="12" fill="url(#bg)"/>
  <g>
    <rect class="box pulse" x="40" y="40" width="150" height="60"/>
    <text class="txt" x="115" y="65">Frontend</text>
    <text class="sub" x="115" y="85">Next.js 16</text>

    <rect class="box pulse" x="240" y="40" width="150" height="60" style="animation-delay:0.3s"/>
    <text class="txt" x="315" y="65">API Layer</text>
    <text class="sub" x="315" y="85">FastAPI /api/v1</text>

    <rect class="box pulse" x="440" y="40" width="150" height="60" style="animation-delay:0.6s"/>
    <text class="txt" x="515" y="65">Services</text>
    <text class="sub" x="515" y="85">alignment, findings</text>

    <rect class="box pulse" x="640" y="40" width="150" height="60" style="animation-delay:0.9s"/>
    <text class="txt" x="715" y="65">Database</text>
    <text class="sub" x="715" y="85">SQLite / PG</text>

    <rect class="box pulse" x="240" y="150" width="150" height="60" style="animation-delay:1.2s"/>
    <text class="txt" x="315" y="175">AI Provider</text>
    <text class="sub" x="315" y="195">Mock / Gemini / Groq</text>

    <rect class="box pulse" x="440" y="150" width="150" height="60" style="animation-delay:1.5s"/>
    <text class="txt" x="515" y="175">Temporal</text>
    <text class="sub" x="515" y="195">intervals, supersession</text>

    <rect class="box pulse" x="640" y="150" width="150" height="60" style="animation-delay:1.8s"/>
    <text class="txt" x="715" y="175">Reporting</text>
    <text class="sub" x="715" y="195">JSON / Markdown</text>
  </g>
  <g stroke="#38bdf8" stroke-width="2" fill="none" class="flow">
    <line x1="190" y1="70" x2="240" y2="70"/>
    <line x1="390" y1="70" x2="440" y2="70"/>
    <line x1="590" y1="70" x2="640" y2="70"/>
    <line x1="315" y1="100" x2="315" y2="150"/>
    <line x1="515" y1="100" x2="515" y2="150"/>
    <line x1="715" y1="100" x2="715" y2="150"/>
  </g>
  <text x="450" y="245" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">RELATRUM architecture - animated overview</text>
</svg>

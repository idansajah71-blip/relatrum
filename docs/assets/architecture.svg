<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="RELATRUM architecture">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="420" rx="12" fill="url(#a)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="40" y="30" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="170" y="55" text-anchor="middle" font-weight="600">Frontend</text>
    <text x="170" y="75" text-anchor="middle" font-size="11" fill="#94a3b8">Next.js 16, React, Tailwind</text>

    <rect x="340" y="30" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="470" y="55" text-anchor="middle" font-weight="600">API Layer</text>
    <text x="470" y="75" text-anchor="middle" font-size="11" fill="#94a3b8">FastAPI /api/v1, RBAC, envelopes</text>

    <rect x="640" y="30" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="770" y="55" text-anchor="middle" font-weight="600">Service Layer</text>
    <text x="770" y="75" text-anchor="middle" font-size="11" fill="#94a3b8">ingestion, extraction, alignment</text>

    <rect x="40" y="130" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="170" y="155" text-anchor="middle" font-weight="600">Models</text>
    <text x="170" y="175" text-anchor="middle" font-size="11" fill="#94a3b8">19 tables, FKs, indexes</text>

    <rect x="340" y="130" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="470" y="155" text-anchor="middle" font-weight="600">AI Provider</text>
    <text x="470" y="175" text-anchor="middle" font-size="11" fill="#94a3b8">Mock / Gemini / Groq</text>

    <rect x="640" y="130" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="770" y="155" text-anchor="middle" font-weight="600">Database</text>
    <text x="770" y="175" text-anchor="middle" font-size="11" fill="#94a3b8">SQLite / PostgreSQL</text>

    <rect x="40" y="230" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="170" y="255" text-anchor="middle" font-weight="600">Temporal</text>
    <text x="170" y="275" text-anchor="middle" font-size="11" fill="#94a3b8">intervals, supersession</text>

    <rect x="340" y="230" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="470" y="255" text-anchor="middle" font-weight="600">Findings</text>
    <text x="470" y="275" text-anchor="middle" font-size="11" fill="#94a3b8">dossiers, evidence polarity</text>

    <rect x="640" y="230" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="770" y="255" text-anchor="middle" font-weight="600">MRE</text>
    <text x="770" y="275" text-anchor="middle" font-size="11" fill="#94a3b8">verification tasks</text>

    <rect x="40" y="330" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="170" y="355" text-anchor="middle" font-weight="600">Reporting</text>
    <text x="170" y="375" text-anchor="middle" font-size="11" fill="#94a3b8">JSON / Markdown / graph</text>

    <rect x="340" y="330" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="470" y="355" text-anchor="middle" font-weight="600">Audit</text>
    <text x="470" y="375" text-anchor="middle" font-size="11" fill="#94a3b8">append-only events</text>

    <rect x="640" y="330" width="260" height="60" rx="8" fill="#1e3a8a"/>
    <text x="770" y="355" text-anchor="middle" font-weight="600">Auth/RBAC</text>
    <text x="770" y="375" text-anchor="middle" font-size="11" fill="#94a3b8">JWT, roles, tenancy</text>
  </g>
  <g stroke="#334155" stroke-width="1" fill="none">
    <line x1="300" y1="60" x2="340" y2="60"/>
    <line x1="600" y1="60" x2="640" y2="60"/>
    <line x1="170" y1="90" x2="170" y2="130"/>
    <line x1="470" y1="90" x2="470" y2="130"/>
    <line x1="770" y1="90" x2="770" y2="130"/>
    <line x1="170" y1="190" x2="170" y2="230"/>
    <line x1="470" y1="190" x2="470" y2="230"/>
    <line x1="770" y1="190" x2="770" y2="230"/>
    <line x1="170" y1="290" x2="170" y2="330"/>
    <line x1="470" y1="290" x2="470" y2="330"/>
    <line x1="770" y1="290" x2="770" y2="330"/>
  </g>
  <text x="550" y="410" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">RELATRUM modular monolith - backend architecture</text>
</svg>

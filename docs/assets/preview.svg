<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="RELATRUM preview mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .card { fill: #0f172a; stroke: #1f2937; stroke-width: 1; rx: 8; }
      .title { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
      .txt { font-family: Segoe UI, Inter, Arial, sans-serif; font-size: 10px; fill: #94a3b8; }
      .btn { fill: #1e3a8a; rx: 4; }
      .shimmer { animation: sh 3s ease-in-out infinite; }
      @keyframes sh { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="40" rx="8" fill="#111827" stroke="#1f2937"/>
  <text x="40" y="45" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">RELATRUM - Case workbench</text>
  <g transform="translate(20,80)">
    <rect class="card shimmer" width="200" height="70"/>
    <text class="title" x="15" y="25">Statements</text>
    <text class="txt" x="15" y="45">12 extracted</text>
    <text class="txt" x="15" y="60">4 requirements</text>
  </g>
  <g transform="translate(240,80)">
    <rect class="card shimmer" width="200" height="70" style="animation-delay:0.3s"/>
    <text class="title" x="15" y="25">Alignments</text>
    <text class="txt" x="15" y="45">8 candidate pairs</text>
    <text class="txt" x="15" y="60">2 possible contradictions</text>
  </g>
  <g transform="translate(460,80)">
    <rect class="card shimmer" width="200" height="70" style="animation-delay:0.6s"/>
    <text class="title" x="15" y="25">Findings</text>
    <text class="txt" x="15" y="45">5 dossiers</text>
    <text class="txt" x="15" y="60">2 pending review</text>
  </g>
  <g transform="translate(680,80)">
    <rect class="card shimmer" width="200" height="70" style="animation-delay:0.9s"/>
    <text class="title" x="15" y="25">Verification</text>
    <text class="txt" x="15" y="45">3 open tasks</text>
    <text class="txt" x="15" y="60">1 evidence received</text>
  </g>
  <g transform="translate(20,170)">
    <rect class="card" width="420" height="130"/>
    <text class="title" x="15" y="25">Findings</text>
    <rect x="15" y="40" width="390" height="24" rx="4" fill="#111827"/>
    <text class="txt" x="25" y="56">Possible requirement deviation - pending review</text>
    <rect x="15" y="70" width="390" height="24" rx="4" fill="#111827"/>
    <text class="txt" x="25" y="86">Missing observation evidence - pending review</text>
    <rect x="15" y="100" width="390" height="24" rx="4" fill="#111827"/>
    <text class="txt" x="25" y="116">Unexplained operational practice - pending review</text>
  </g>
  <g transform="translate(460,170)">
    <rect class="card" width="420" height="130"/>
    <text class="title" x="15" y="25">Evidence graph (preview)</text>
    <circle cx="60" cy="70" r="12" fill="#1e3a8a" stroke="#38bdf8"/>
    <circle cx="180" cy="60" r="12" fill="#064e3b" stroke="#34d399"/>
    <circle cx="300" cy="80" r="12" fill="#1e3a8a" stroke="#38bdf8"/>
    <circle cx="120" cy="110" r="10" fill="#7c2d12" stroke="#fbbf24"/>
    <line x1="72" y1="70" x2="168" y2="60" stroke="#334155" stroke-width="1.5"/>
    <line x1="192" y1="60" x2="288" y2="80" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="100" x2="120" y2="70" stroke="#334155" stroke-width="1.5"/>
    <text class="txt" x="15" y="150">ILLUSTRATIVE mockup - not real data</text>
  </g>
</svg>
